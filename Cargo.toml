[package]
name = "codesearch"
version = "0.1.0"
edition = "2021"
description = "Search Rust codebases for functions by their parameter and return types"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
# `span-locations` is required so `syn` spans carry line numbers outside a proc-macro.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# `bundled` compiles SQLite into the binary: no system libsqlite3 needed at runtime.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
